name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão (ex: 1.0.0)'
        required: false
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libgl1-mesa-dev zip

      - name: Build binaries
        run: |
          make clean
          make
          make gui

      - name: Run validation
        run: ./uvm validate

      - name: Create package
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          bash packaging/itch/build-itch.sh "$VERSION"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: dist/*.zip

  build-windows:
    name: Build Windows (x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MinGW-w64
        uses: egor-tensin/setup-mingw@v2
        with:
          platform: x64

      - name: Download SDL2 for MinGW
        shell: bash
        run: |
          # Baixa SDL2-devel-mingw e extrai para third_party/SDL2
          curl -L -o /tmp/sdl2.zip \
            "https://github.com/libsdl-org/SDL/releases/download/release-2.32.4/SDL2-devel-2.32.4-mingw.zip"
          mkdir -p third_party
          cd third_party
          unzip -q /tmp/sdl2.zip
          # A pasta extraída é SDL2-2.32.4 — renomeia para SDL2
          mv SDL2-2.32.4 SDL2 2>/dev/null || true
          ls -la SDL2/

      - name: Build & package Windows
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          bash packaging/windows/build-windows.sh "$VERSION"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: dist/*.zip

  release:
    name: Create Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/linux-package/*.zip
            artifacts/windows-package/*.zip
          generate_release_notes: true
